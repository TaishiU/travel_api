name: Notify repository of architecture_study

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send repository dispatch
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: TaishiU/architecture_study
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh api \
            --method POST \
            "/repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type="repository_travel_api_updated" \
            -f client_payload[repository]="${SOURCE_REPOSITORY}" \
            -f client_payload[branch]="${SOURCE_BRANCH}" \
            -f client_payload[sha]="${SOURCE_SHA}" \
            -f client_payload[message]="${COMMIT_MESSAGE}"